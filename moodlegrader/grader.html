<!DOCTYPE html>
<html lang="en">
<head>
	
</head>
<body>
	<input type="file" id="files">
	<pre id="fileContents"></pre>
	<script>
		const resultPanel = document.getElementById('fileContents');
		const inputElement = document.getElementById('files');
		
		inputElement?.addEventListener('change', () => {
		  const file = inputElement.files?.[0];
		  if (!file) alert('no file!');
		  
		  const file_name_stem = file.name.split(".")[0];
		
		  const reader = new FileReader();
		  reader.readAsText(file, 'UTF-8');
		  reader.onload = function({ target }) {
// 		  	resultPanel.textContent = target.result;
			let months = {
				'January': 1,
				'February': 2,
				'March': 3,
				'April': 4,
				'May': 5,
				'June': 6,
				'July': 7,
				'August': 8,
				'September': 9,
				'October': 10,
				'November': 11,
				'December': 12
			};
			
			let passing_score = 8;
			
			let current_student_first_name = null;
			let current_student_last_name = null;
			
			let header_row = null;
			
			let students = {};
			
// 			console.debug(target.result);

			let lines = target.result.split('\n');
			
// 			console.debug(lines);

			// skip the first row for processing
			for(let line_count=1; line_count<lines.length; line_count++) {
				let row = parse(lines[line_count]);
				
				// check for empty-ish rows
				if (row[0] == "" || row[1] == "" || row[5] == "-" || row[6] == "" || row[9] == "-") {
					//console.debug('empty row');
					continue;
				}
				
				let student_key = row[1] + ":" + row[0];
				console.debug(student_key);
				
				if (!(student_key in students)) {
					students[student_key] = {
						"first_name": row[1],
						"last_name": row[0],
						"quiz_results_by_date": {}
					};
				}
				
				let current_student = students[student_key];
				console.debug(current_student);
				
				console.debug(row[5]);
				let completion_date_split = row[5].split(" ");
				
				// get the parts of the date and pad with zeroes
				let completion_date_components = [
					('0' + String(months[completion_date_split[1]])).slice(-2), //month
					('0' + String(completion_date_split[0])).slice(-2), //day
					('0' + String(completion_date_split[2])).slice(-2) //year
				];
				
				let completion_date_key = completion_date_components.join("/");
				
				if (!(completion_date_key in current_student["quiz_results_by_date"])) {
					current_student["quiz_results_by_date"][completion_date_key] = [0, 0, []];
				}
				
				current_student["quiz_results_by_date"][completion_date_key][0] += 1;
				current_student["quiz_results_by_date"][completion_date_key][2].push(row[6]);
				
				let attempt_score = 0;
				
				try {
					attempt_score = parseInt(row[7]);
				} catch {
				
				}
				
				if (attempt_score >= passing_score) {
					current_student["quiz_results_by_date"][completion_date_key][1] += 1;
				}
			}
				
				
			// create the file string
			let output_lines = [];
			
			output_lines.push([
				"Last Name",
				"First Name",
				"Date",
				"Attempts",
				"Quality Scores",
				"Total Time",
				"Average Time"
			].join(","));
			
			for (const [student_key, student] of Object.entries(students)) {
				
				for (const [date, results] of Object.entries(student["quiz_results_by_date"])) {
					// console.debug(results);
					attempt_counter = results[0];
					pass_counter = results[1];
					
					let total_seconds = 0;
					
					for (const [key, duration] of Object.entries(results[2])) {
						console.debug(duration);
						let duration_components = duration.split(" ");
						
						if (duration.includes("-")) {
							
						} else if (duration.includes("min")) {
							total_seconds += 60 * parseInt(duration_components[0]);
							
							if (duration.includes("secs")) {
								total_seconds += parseInt(duration_components[2]);
							}
						} else {
							total_seconds += parseInt(duration_components[0]);
						}
					}
					
					let total_minutes = parseInt(total_seconds / 60);
					let remainder_seconds = total_seconds % 60;
					
					let average_duration = Math.round(total_seconds / results[2].length);
					
					let average_minutes = parseInt(average_duration / 60);
					let average_seconds = average_duration % 60;
					
					output_lines.push([
						student["last_name"],
						student["first_name"],
						date,
						attempt_counter,
						pass_counter,
						String(total_minutes) + ":" + ('0' + String(remainder_seconds)).slice(-2),
						String(average_minutes) + ":" + ('0' + String(average_seconds)).slice(-2)
					].join(","));
					
					// print(student["last_name"], student["first_name"], date, attempt_counter, pass_counter, str(total_minutes) + ":" + str(remainder_seconds).zfill(2), str(average_minutes) + ":" + str(average_seconds).zfill(2))
				}
			}
			
			// generate the file
			let textblob = new Blob([output_lines.join("\n")], { type: 'text/csv' });
			let dwnlnk = document.createElement('a');
			dwnlnk.download = file_name_stem + ' Python.csv';
			if (window.webkitURL != null) {
				dwnlnk.href = window.webkitURL.createObjectURL(textblob);
			} else {
				dwnlnk.href = window.URL.createObjectURL(textblob);
			}
			dwnlnk.click();
		  }
		  
		  reader.onerror = function() {
			resultPanel.textContent = 'error reading file';
		  }
		});
		
		function parse(row){
			var insideQuote = false,                                             
			  entries = [],                                                    
			  entry = [];
			
			row.split('').forEach(function (character) {                         
				if(character === '"') {
				  insideQuote = !insideQuote;                                      
				} else {
				  if(character == "," && !insideQuote) {                           
					entries.push(entry.join(''));                                  
					entry = [];                                                    
				  } else {
					entry.push(character);                                         
				  }                                                                
				}                                                                  
			});
			
			entries.push(entry.join(''));
			
			return entries;                                                      
		}

	</script>
</body>
</html>
