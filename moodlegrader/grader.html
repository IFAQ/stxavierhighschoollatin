<!DOCTYPE html>
<html lang="en">
<head>
	
</head>
<body>
	<input type="file" id="files">
	<pre id="fileContents"></pre>
	<script>
		const resultPanel = document.getElementById('fileContents');
		const inputElement = document.getElementById('files');
		
		inputElement?.addEventListener('change', () => {
		  const file = inputElement.files?.[0];
		  if (!file) alert('no file!');
		
		  const reader = new FileReader();
		  reader.readAsText(file, 'UTF-8');
		  reader.onload = function({ target }) {
// 		  	resultPanel.textContent = target.result;
			let months = [
				'', // here to make indices line up with month number
				'January',
				'February',
				'March',
				'April',
				'May',
				'June',
				'July',
				'August',
				'September',
				'October',
				'November',
				'December'
			];
			
			let passing_score = 8;
			
			let current_student_first_name = null;
			let current_student_last_name = null;
			
			let header_row = null;
			
			let students = {};
			
// 			console.debug(target.result);

			let lines = target.result.split('\n');
			
// 			console.debug(lines);

			// skip the first row for processing
			for(let line_count=1; line_count<lines.length; line_count++) {
				let row = parse(lines[line_count]);
				
				// check for empty-ish rows
				if (row[1] == "" || row[5] == "-" || row[6] == "" || row[9] == "-") {
					console.debug('empty row');
					continue;
				}
				
				let student_key = row[1] + ":" + row[0];
				console.debug(student_key);
				
				if (!(student_key in students)) {
					students[student_key] = {
						"first_name": row[1],
						"last_name": row[0],
						"quiz_results_by_date": {}
					};
				}
				
				let current_student = students[student_key];
				console.debug(current_student);
				
				console.debug(row[5]);
				let completion_date_split = row[5].split(" ");
				
				// get the parts of the date and pad with zeroes
				let completion_date_components = [
					('0' + String(completion_date_split[1])).slice(-2), //month
					('0' + String(completion_date_split[0])).slice(-2), //day
					String(completion_date_split[2]) //year
				];
				
				let completion_date_key = completion_date_components.join("/");
				
				if (!(completion_date_key in current_student["quiz_results_by_date"])) {
					current_student["quiz_results_by_date"][completion_date_key] = [0, 0, []];
				}
				
				current_student["quiz_results_by_date"][completion_date_key][0] += 1
				current_student["quiz_results_by_date"][completion_date_key][2].push(row[8])
				
				let attempt_score = 0;
				
				try {
					attempt_score = parseInt(row[7]);
				} catch {
				
				}
				
				if (attempt_score >= passing_score) {
					current_student["quiz_results_by_date"][completion_date_key][1] += 1
				}
			}
		  }
		  reader.onerror = function() {
			resultPanel.textContent = 'error reading file';
		  }
		});
		
		function parse(row){
			var insideQuote = false,                                             
			  entries = [],                                                    
			  entry = [];
			
			row.split('').forEach(function (character) {                         
				if(character === '"') {
				  insideQuote = !insideQuote;                                      
				} else {
				  if(character == "," && !insideQuote) {                           
					entries.push(entry.join(''));                                  
					entry = [];                                                    
				  } else {
					entry.push(character);                                         
				  }                                                                
				}                                                                  
			});
			
			entries.push(entry.join(''));
			
			return entries;                                                      
		}

	</script>
</body>
</html>
